<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оформление заказа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #2481cc;
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #222222);
            --sec-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
            --hint: var(--tg-theme-hint-color, #8e8e93);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 20px; padding-bottom: 100px;
            opacity: 0; transition: opacity 0.5s ease;
        }

        #progress {
            position: fixed; top: 0; left: 0; height: 3px;
            width: 0%; background: var(--primary);
            z-index: 1000; transition: width 0.3s ease;
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { margin: 0; font-size: 22px; font-weight: 700; }

        .urgency-container {
            display: none; background: rgba(255, 59, 48, 0.08); 
            border: 1px solid rgba(255, 59, 48, 0.2); 
            border-radius: 12px; padding: 12px; margin-bottom: 20px; 
            align-items: center; gap: 10px;
        }

        .option-card {
            background: var(--sec-bg);
            border: 2px solid transparent;
            border-radius: 16px; padding: 16px;
            margin-bottom: 12px; cursor: pointer;
            position: relative; transition: all 0.2s ease;
        }
        .option-card.active {
            border-color: var(--primary);
            background: rgba(36, 129, 204, 0.05);
        }
        .option-card b { display: block; font-size: 16px; margin-bottom: 4px; }
        .option-card span { font-size: 12px; opacity: 0.7; display: block; }
        .price-tag { position: absolute; right: 16px; top: 16px; font-weight: 700; color: var(--primary); }
        
        .badge {
            position: absolute; top: -10px; left: 16px;
            background: var(--primary); color: white;
            font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 8px;
        }

        .form-section { margin-top: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 11px; font-weight: 700; color: var(--hint); text-transform: uppercase; }
        input, textarea {
            width: 100%; padding: 14px; border: 1px solid rgba(0,0,0,0.05); border-radius: 12px;
            background: var(--sec-bg); color: var(--text); font-size: 16px; box-sizing: border-box;
        }

        .footer { position: fixed; bottom: 0; left: 0; width: 100%; padding: 16px; background: var(--bg); border-top: 1px solid rgba(0,0,0,0.05); }
        .btn-main {
            width: 100%; padding: 18px; border: none; border-radius: 16px;
            background: var(--primary); color: white; font-size: 16px; font-weight: 700;
            opacity: 0.5; transition: all 0.3s ease;
        }
        .btn-main.ready { opacity: 1; }
    </style>
</head>
<body onload="document.body.style.opacity='1'; updateUrgency();">

<div id="progress"></div>

<div class="header">
    <h2>Ваш идеальный порядок 🍏</h2>
</div>

<div id="urgency-banner" class="urgency-container">
    <span style="font-size: 20px;">🔥</span>
    <span id="urgency-text" style="font-size: 13px; color: #d32f2f; font-weight: 500;"></span>
</div>

<div id="options">
    <div class="option-card" id="card-recipes" onclick="selectOption('recipes', 990, this)">
        <b>📖 Рецепты (PDF-сборник)</b>
        <span>Доступ сразу после оплаты.</span>
        <div class="price-tag">990₽</div>
    </div>

    <div class="option-card" id="card-cards" onclick="selectOption('cards', 1990, this)">
        <b>🧲 Магнитные карточки</b>
        <span>154 магнита. Порядок из Reels.</span>
        <div class="price-tag">1990₽</div>
    </div>

    <div class="option-card active" id="card-combo" onclick="selectOption('combo', 2680, this)">
        <div class="badge">Лучший выбор</div>
        <b>🔥 COMBO: Карточки + PDF</b>
        <span>Полная система. Максимальная выгода.</span>
        <div class="price-tag">2680₽</div>
    </div>
</div>

<div id="shipping_section" class="form-section">
    <div class="form-group">
        <label>ФИО получателя</label>
        <input type="text" id="name" placeholder="Иванов Иван Иванович" oninput="updateProgress()">
    </div>
    <div class="form-group">
        <label>Контактный телефон</label>
        <input type="tel" id="phone" placeholder="+7 (___) ___-__-__">
    </div>
    <div class="form-group">
        <label>Адрес доставки (СДЭК или дом)</label>
        <textarea id="address" rows="2" placeholder="Город, ПВЗ СДЭК или домашний адрес" oninput="updateProgress()"></textarea>
    </div>
</div>

<div class="footer">
    <button class="btn-main" id="submit_btn" onclick="sendData()">Оформить за 2680₽</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let selectedProduct = 'combo';
    let selectedPrice = 2680;

    function updateUrgency() {
        const now = new Date();
        const banner = document.getElementById('urgency-banner');
        const textElem = document.getElementById('urgency-text');
        const ordersCount = 3 + (now.getDate() % 5); 

        if (now.getHours() < 16) {
            textElem.innerHTML = `Сегодня отправляем <b>${ordersCount} заказов</b>. Успей до 16:00!`;
        } else {
            textElem.innerHTML = `Успей оформить сейчас, чтобы попасть в утреннюю отправку!`;
        }
        banner.style.display = 'flex';
    }

    const phoneInput = document.getElementById('phone');
    phoneInput.addEventListener('input', (e) => {
        let val = e.target.value.replace(/\D/g, '');
        if (val.startsWith('7') || val.startsWith('8')) val = val.substring(1);
        let res = '+7 (';
        if (val.length > 0) res += val.substring(0, 3);
        if (val.length > 3) res += ') ' + val.substring(3, 6);
        if (val.length > 6) res += '-' + val.substring(6, 8);
        if (val.length > 8) res += '-' + val.substring(8, 10);
        e.target.value = res;
        updateProgress();
    });

    function selectOption(type, price, element) {
        selectedProduct = type;
        selectedPrice = price;
        document.querySelectorAll('.option-card').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        
        // Скрываем поля доставки только если выбраны чистые рецепты
        const shipping = document.getElementById('shipping_section');
        shipping.style.display = (type === 'recipes') ? 'none' : 'block';
        
        document.getElementById('submit_btn').innerText = `Оформить за ${price}₽`;
        updateProgress();
        tg.HapticFeedback.selectionChanged();
    }

    function updateProgress() {
        let isReady = false;
        
        if (selectedProduct === 'recipes') {
            isReady = true; // Для PDF данные не обязательны (возьмем из TG)
        } else {
            const nameOk = document.getElementById('name').value.trim().length > 5;
            const phoneOk = document.getElementById('phone').value.length === 18;
            const addrOk = document.getElementById('address').value.trim().length > 10;
            isReady = nameOk && phoneOk && addrOk;
        }

        const btn = document.getElementById('submit_btn');
        const progress = document.getElementById('progress');
        
        if (isReady) {
            btn.classList.add('ready');
            progress.style.width = '100%';
        } else {
            btn.classList.remove('ready');
            progress.style.width = '50%';
        }
    }

    function sendData() {
        const btn = document.getElementById('submit_btn');
        if (!btn.classList.contains('ready')) {
            tg.HapticFeedback.notificationOccurred('error');
            return;
        }

        const data = {
            product_type: selectedProduct,
            price: selectedPrice,
            name: document.getElementById('name').value || "Не указано (PDF)",
            phone: document.getElementById('phone').value || "Не указано",
            address: document.getElementById('address').value || "Цифровая доставка"
        };

        tg.sendData(JSON.stringify(data));
        tg.close();
    }

    updateProgress();
</script>
</body>
</html>
