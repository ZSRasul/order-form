<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оформление заказа карточек</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Основные стили, адаптированные под тему Telegram */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
            margin: 0;
            padding: 20px;
            padding-bottom: 80px; /* Место для фиксированной кнопки */
            overflow-x: hidden;
        }

        /* Красивый заголовок */
        .header {
            text-align: center;
            margin-bottom: 25px;
            animation: fadeInDown 0.5s ease;
        }
        .header h3 { margin: 0; font-size: 22px; font-weight: 700; }
        .header p { margin: 5px 0 0; font-size: 14px; opacity: 0.7; }

        /* Контейнер формы */
        .form-container {
            animation: fadeInUp 0.5s ease;
        }

        /* Стили для полей ввода */
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0.9;
            color: var(--tg-theme-hint-color, #8e8e93);
        }

        input[type="text"],
        input[type="tel"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #222222);
            transition: all 0.2s ease;
            -webkit-appearance: none; /* Убирает стандартные стили iOS */
        }

        /* Эффект при клике на поле */
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #2481cc);
            box-shadow: 0 0 0 2px rgba(36, 129, 204, 0.2);
            background-color: var(--tg-theme-bg-color, #ffffff);
        }

        textarea { resize: none; }

        /* Крутая анимированная кнопка, фиксированная внизу */
        .footer-button {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
            border-top: 1px solid rgba(0,0,0,0.05);
            z-index: 100;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            
            /* Цвета из темы Telegram */
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            
            /* Эффект нажатия */
            box-shadow: 0 4px 10px rgba(36, 129, 204, 0.3);
        }

        .btn-submit:active {
            transform: scale(0.98);
            box-shadow: 0 2px 5px rgba(36, 129, 204, 0.3);
            opacity: 0.9;
        }

        /* Анимации появления */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Иконки в полях (опционально, для красоты) */
        .input-icon {
            position: absolute;
            right: 15px;
            top: 40px;
            opacity: 0.3;
        }

        /* Стили для кастомного селектора */
        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 15px;
            padding-right: 40px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>✨ Оформление заказа</h3>
        <p>Заполните данные для доставки по РФ</p>
    </div>

    <div class="form-container">
        <div class="form-group">
            <label>ФИО получателя</label>
            <input type="text" id="name" placeholder="Иванов Иван Иванович" autocomplete="name">
        </div>

        <div class="form-group">
            <label>Контактный телефон</label>
            <input type="tel" id="phone" placeholder="+7 (900) 000-00-00" autocomplete="tel">
        </div>

        <div class="form-group">
            <label>Адрес (Город, ПВЗ СДЭК или домашний)</label>
            <textarea id="address" rows="3" placeholder="г. Казань, ул. Пушкина, д. 1, кв. 10"></textarea>
        </div>

        <div class="form-group">
            <label>Количество наборов (шт)</label>
            <input type="number" id="quantity" value="1" min="1" max="10">
        </div>

        <div class="form-group">
            <label>Способ доставки</label>
            <select id="delivery">
                <option value="СДЭК (ПВЗ)">СДЭК (до пункта выдачи)</option>
                <option value="Почта России">Почта России</option>
                <option value="Курьер СДЭК">Курьер СДЭК (до двери)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Комментарий к заказу (необязательно)</label>
            <input type="text" id="comment" placeholder="Например: номер ПВЗ СДЭК">
        </div>
    </div>

    <div class="footer-button">
        <button class="btn-submit" id="order_btn">Подтвердить заказ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на все окно

        // Делаем MainButton от Telegram активной (как альтернатива нашей кнопке)
        tg.MainButton.setText("ПОДТВЕРДИТЬ ЗАКАЗ");
        tg.MainButton.show();
        
        // Обработка клика на кастомную кнопку в HTML
        let btn = document.getElementById("order_btn");
        btn.addEventListener("click", sendData);
        
        // Обработка клика на MainButton от Telegram
        tg.onEvent('mainButtonClicked', sendData);

        function sendData() {
            let name = document.getElementById("name").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let address = document.getElementById("address").value.trim();
            let quantity = document.getElementById("quantity").value;
            let delivery = document.getElementById("delivery").value;
            let comment = document.getElementById("comment").value.trim();

            // Простая дружелюбная валидация
            if (name.length < 5) {
                tg.HapticFeedback.notificationOccurred('error');
                alert("Пожалуйста, введите полное ФИО.");
                return;
            }
            if (phone.length < 7) {
                tg.HapticFeedback.notificationOccurred('error');
                alert("Пожалуйста, введите корректный номер телефона.");
                return;
            }
            if (address.length < 10) {
                tg.HapticFeedback.notificationOccurred('error');
                alert("Пожалуйста, напишите более подробный адрес.");
                return;
            }

            let data = {
                name: name,
                phone: phone,
                address: address,
                quantity: quantity,
                delivery: delivery,
                comment: comment
            };

            // Легкая вибрация при успешной отправке (только на мобильных)
            tg.HapticFeedback.notificationOccurred('success');
            
            tg.sendData(JSON.stringify(data)); // Отправляем JSON боту
            tg.close(); // Закрываем форму
        }
    </script>
</body>
</html>
