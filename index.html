<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { 
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; 
            box-sizing: border-box; background: var(--tg-theme-secondary-bg-color); color: var(--tg-theme-text-color);
        }
        .btn { 
            display: block; width: 100%; padding: 15px; border: none; border-radius: 8px; 
            background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); 
            font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>
    <h3>📦 Данные для доставки</h3>
    <div class="form-group">
        <label>ФИО</label>
        <input type="text" id="name" placeholder="Иванов Иван Иванович">
    </div>
    <div class="form-group">
        <label>Телефон</label>
        <input type="tel" id="phone" placeholder="+7 (900) 000-00-00">
    </div>
    <div class="form-group">
        <label>Адрес (Город, ПВЗ или дом)</label>
        <textarea id="address" rows="2" placeholder="г. Москва, ул. Ленина, д. 1, кв. 1"></textarea>
    </div>
    <div class="form-group">
        <label>Количество (шт)</label>
        <input type="number" id="quantity" value="1" min="1">
    </div>
    <div class="form-group">
        <label>Способ доставки</label>
        <select id="delivery">
            <option value="СДЭК">СДЭК</option>
            <option value="Почта России">Почта России</option>
        </select>
    </div>
    <div class="form-group">
        <label>Комментарий (необязательно)</label>
        <input type="text" id="comment" placeholder="Например: номер ПВЗ">
    </div>

    <button class="btn" id="order_btn">Подтвердить заказ</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на все окно

        let btn = document.getElementById("order_btn");

        btn.addEventListener("click", () => {
            let name = document.getElementById("name").value;
            let phone = document.getElementById("phone").value;
            let address = document.getElementById("address").value;
            let quantity = document.getElementById("quantity").value;
            let delivery = document.getElementById("delivery").value;
            let comment = document.getElementById("comment").value;

            if (name.length < 5 || phone.length < 5 || address.length < 10) {
                alert("Пожалуйста, заполните данные корректно");
                return;
            }

            let data = {
                name: name,
                phone: phone,
                address: address,
                quantity: quantity,
                delivery: delivery,
                comment: comment
            };

            tg.sendData(JSON.stringify(data)); // Отправляем JSON боту
            tg.close(); // Закрываем форму
        });
    </script>
</body>
</html>
