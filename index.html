<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Оформление заказа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #2481cc;
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #222222);
            --sec-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
            --hint: var(--tg-theme-hint-color, #8e8e93);
            --success: #2e7d32;
            --warning: #e65100;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 20px; padding-bottom: 120px;
            opacity: 0; transition: opacity 0.5s ease;
        }

        #progress {
            position: fixed; top: 0; left: 0; height: 3px;
            width: 50%; background: var(--primary);
            z-index: 1000; transition: width 0.3s ease;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0; font-size: 22px; font-weight: 700; }

        .urgency-container {
            display: none; background: rgba(255, 59, 48, 0.08); 
            border: 1px solid rgba(255, 59, 48, 0.2); 
            border-radius: 12px; padding: 12px; margin-bottom: 20px; 
            align-items: center; gap: 10px; animation: slideUp 0.4s ease;
        }

        .option-card {
            background: var(--sec-bg);
            border: 2px solid transparent;
            border-radius: 16px; padding: 16px;
            margin-bottom: 12px; cursor: pointer;
            position: relative; transition: all 0.2s ease;
        }
        .option-card.active {
            border-color: var(--primary);
            background: rgba(36, 129, 204, 0.05);
            transform: scale(1.01);
        }
        .option-card b { display: block; font-size: 16px; margin-bottom: 4px; padding-right: 60px; }
        .option-card span { font-size: 12px; opacity: 0.7; line-height: 1.4; display: block; }
        .price-tag { position: absolute; right: 16px; top: 16px; font-weight: 700; color: var(--primary); }
        
        .badge {
            position: absolute; top: -10px; left: 16px;
            background: var(--primary); color: white;
            font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 8px;
            text-transform: uppercase;
        }

        /* Доставка */
        .free-shipping-badge {
            display: inline-block; background: #e8f5e9; color: var(--success);
            font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 8px;
            margin-bottom: 4px; text-transform: uppercase; transition: all 0.3s ease;
        }
        .free-shipping-badge.warning { background: #fff3e0; color: var(--warning); }
        .shipping-note { font-size: 10px; opacity: 0.5; margin-bottom: 12px; margin-left: 2px; }

        .delivery-selector { display: flex; gap: 8px; margin-bottom: 15px; }
        .delivery-option {
            flex: 1; padding: 10px; background: var(--sec-bg);
            border: 1.5px solid transparent; border-radius: 12px;
            text-align: center; font-size: 12px; font-weight: 600; cursor: pointer;
        }
        .delivery-option.active { border-color: var(--primary); color: var(--primary); background: rgba(36,129,204,0.05); }

        /* Upsell */
        .upsell-card {
            background: linear-gradient(135deg, rgba(36,129,204,0.05) 0%, rgba(36,129,204,0.1) 100%);
            border: 1px dashed var(--primary); border-radius: 12px;
            padding: 12px; margin: 20px 0; display: flex; align-items: center; gap: 12px; cursor: pointer;
        }
        .upsell-card input { width: 20px; height: 20px; accent-color: var(--primary); }
        .upsell-info b { font-size: 14px; display: block; color: var(--primary); }
        .upsell-info span { font-size: 12px; opacity: 0.8; }

        .form-section { margin-top: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 11px; font-weight: 700; color: var(--hint); text-transform: uppercase; }
        input, textarea {
            width: 100%; padding: 14px; border: 1px solid rgba(0,0,0,0.05); border-radius: 12px;
            background: var(--sec-bg); color: var(--text); font-size: 16px; box-sizing: border-box;
        }

        .info-container { margin: 25px 0; }
        details { background: var(--sec-bg); border-radius: 12px; margin-bottom: 8px; }
        summary { padding: 12px 16px; font-size: 14px; font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary::after { content: '→'; opacity: 0.3; transition: transform 0.2s; }
        details[open] summary::after { transform: rotate(90deg); }
        .details-content { padding: 0 16px 12px; font-size: 13px; line-height: 1.5; opacity: 0.8; }

        .footer { position: fixed; bottom: 0; left: 0; width: 100%; padding: 16px; background: var(--bg); box-sizing: border-box; z-index: 100; border-top: 1px solid rgba(0,0,0,0.05); }
