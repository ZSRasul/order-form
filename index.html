<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оформление заказа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #2481cc;
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #222222);
            --sec-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
            --hint: var(--tg-theme-hint-color, #8e8e93);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 20px; padding-bottom: 100px;
            opacity: 0; transition: opacity 0.5s ease;
        }

        #progress {
            position: fixed; top: 0; left: 0; height: 3px;
            width: 0%; background: var(--primary);
            z-index: 1000; transition: width 0.3s ease;
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { margin: 0; font-size: 22px; font-weight: 700; }

        /* Баннер дефицита */
        .urgency-container {
            display: none; background: rgba(255, 59, 48, 0.08); 
            border: 1px solid rgba(255, 59, 48, 0.2); 
            border-radius: 12px; padding: 12px; margin-bottom: 20px; 
            align-items: center; gap: 10px; animation: slideUp 0.4s ease;
        }

        .option-card {
            background: var(--sec-bg);
            border: 2px solid transparent;
            border-radius: 16px; padding: 16px;
            margin-bottom: 12px; cursor: pointer;
            position: relative; transition: all 0.2s ease;
        }
        .option-card.active {
            border-color: var(--primary);
            background: rgba(36, 129, 204, 0.05);
            transform: scale(1.01);
        }
        .option-card b { display: block; font-size: 16px; margin-bottom: 4px; padding-right: 60px; }
        .option-card span { font-size: 12px; opacity: 0.7; line-height: 1.4; display: block; }
        .price-tag { position: absolute; right: 16px; top: 16px; font-weight: 700; color: var(--primary); }
        
        .badge {
            position: absolute; top: -10px; left: 16px;
            background: var(--primary); color: white;
            font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 8px;
            text-transform: uppercase;
        }

        .info-container { margin: 25px 0; }
        details { background: var(--sec-bg); border-radius: 12px; margin-bottom: 8px; }
        summary { 
            padding: 12px 16px; font-size: 14px; font-weight: 600; cursor: pointer; 
            list-style: none; display: flex; justify-content: space-between; align-items: center;
        }
        summary::after { content: '→'; opacity: 0.3; transition: transform 0.2s; }
        details[open] summary::after { transform: rotate(90deg); }
        .details-content { padding: 0 16px 12px; font-size: 13px; line-height: 1.5; opacity: 0.8; }

        .form-section { margin-top: 25px; display: none; }
        .form-section.visible { display: block; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 11px; font-weight: 700; color: var(--hint); text-transform: uppercase; }
        input, textarea {
            width: 100%; padding: 14px; border: 1px solid rgba(0,0,0,0.05); border-radius: 12px;
            background: var(--sec-bg); color: var(--text); font-size: 16px; box-sizing: border-box;
        }

        .footer { position: fixed; bottom: 0; left: 0; width: 100%; padding: 16px; background: var(--bg); box-sizing: border-box; z-index: 100; border-top: 1px solid rgba(0,0,0,0.05); }
        .btn-main {
            width: 100%; padding: 18px; border: none; border-radius: 16px;
            background: var(--primary); color: white; font-size: 16px; font-weight: 700;
            opacity: 0.5; transition: all 0.3s ease;
        }
        .btn-main.ready { opacity: 1; box-shadow: 0 4px 15px rgba(36, 129, 204, 0.3); }
    </style>
</head>
<body onload="document.body.style.opacity='1'; updateUrgency();">

<div id="progress"></div>

<div class="header">
    <h2>Ваш идеальный порядок 🍏</h2>
</div>

<div id="urgency-banner" class="urgency-container">
    <span style="font-size: 20px;">🔥</span>
    <span id="urgency-text" style="font-size: 13px; color: #d32f2f; line-height: 1.4; font-weight: 500;"></span>
</div>

<div id="options">
    <div class="option-card" onclick="selectOption('recipes', 990, this)">
        <b>📖 Рецепты (PDF-сборник)</b>
        <span>28 идей для завтраков, обедов и ужинов. Доступ сразу.</span>
        <div class="price-tag">990₽
